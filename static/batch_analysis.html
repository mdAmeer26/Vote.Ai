<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch PDF Voter Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .upload-section {
            background: #f8f9fa;
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s;
        }

        .upload-section:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-section.dragover {
            border-color: #28a745;
            background: #d4edda;
        }

        #pdfFiles {
            display: none;
        }

        .upload-label {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            transition: transform 0.2s;
        }

        .upload-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .file-list {
            margin-top: 20px;
            text-align: left;
        }

        .file-item {
            background: white;
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #667eea;
        }

        .file-item button {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .analyze-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }

        .analyze-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        .analyze-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 30px 0;
        }

        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 30px;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .summary-card.warning {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
        }

        .summary-card.danger {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
        }

        .summary-card.success {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .summary-card h3 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .voters-table {
            width: 100%;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .table-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            font-size: 1.3em;
        }

        .filters {
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn {
            padding: 8px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .voter-row {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            transition: background 0.2s;
        }

        .voter-row:hover {
            background: #f8f9fa;
        }

        .voter-header {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr 1fr;
            gap: 15px;
            align-items: center;
            cursor: pointer;
        }

        .risk-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            text-align: center;
        }

        .risk-HIGH {
            background: #dc3545;
            color: white;
        }

        .risk-MEDIUM {
            background: #ffc107;
            color: #000;
        }

        .risk-LOW {
            background: #28a745;
            color: white;
        }

        .voter-details {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .voter-details.expanded {
            display: block;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .detail-label {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .flags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .flag-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .flag-active {
            background: #dc3545;
            color: white;
        }

        .flag-inactive {
            background: #e0e0e0;
            color: #666;
        }

        .duplicate-info {
            margin-top: 15px;
            padding: 15px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 8px;
        }

        .export-button {
            margin-top: 20px;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
        }

        .export-button:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗳️ Batch PDF Voter Analysis</h1>
        <p class="subtitle">Upload multiple PDF documents to analyze voter data and detect fraud patterns</p>

        <div class="upload-section" id="uploadSection">
            <h2>📄 Upload PDF Documents</h2>
            <p style="margin: 15px 0;">Drag and drop PDF files here or click to select</p>
            <label for="pdfFiles" class="upload-label">Select PDF Files</label>
            <input type="file" id="pdfFiles" accept=".pdf" multiple>
            
            <div class="file-list" id="fileList"></div>
        </div>

        <button class="analyze-button" id="analyzeButton" disabled>Analyze All PDFs</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing PDFs... This may take a few moments</p>
        </div>

        <div class="results" id="results">
            <h2 style="margin-bottom: 20px; color: #667eea;">📊 Analysis Results</h2>
            
            <div class="summary-cards" id="summaryCards"></div>

            <div class="voters-table">
                <div class="table-header">
                    Detailed Voter Analysis
                </div>
                <div class="filters">
                    <span style="font-weight: bold;">Filter by:</span>
                    <button class="filter-btn active" data-filter="all">All Voters</button>
                    <button class="filter-btn" data-filter="HIGH">High Risk</button>
                    <button class="filter-btn" data-filter="MEDIUM">Medium Risk</button>
                    <button class="filter-btn" data-filter="LOW">Low Risk</button>
                    <button class="filter-btn" data-filter="flagged">Flagged Only</button>
                    <button class="filter-btn" data-filter="duplicates">Has Duplicates</button>
                </div>
                <div id="votersList"></div>
            </div>

            <button class="export-button" id="exportButton">Export Results as JSON</button>
        </div>
    </div>

    <script>
        let selectedFiles = [];
        let analysisResults = null;
        let currentFilter = 'all';

        const uploadSection = document.getElementById('uploadSection');
        const fileInput = document.getElementById('pdfFiles');
        const fileList = document.getElementById('fileList');
        const analyzeButton = document.getElementById('analyzeButton');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');

        // Drag and drop functionality
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });

        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });

        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files).filter(f => f.name.endsWith('.pdf'));
            addFiles(files);
        });

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            addFiles(files);
        });

        function addFiles(files) {
            selectedFiles.push(...files);
            updateFileList();
            analyzeButton.disabled = selectedFiles.length === 0;
        }

        function updateFileList() {
            if (selectedFiles.length === 0) {
                fileList.innerHTML = '';
                return;
            }

            fileList.innerHTML = '<h3 style="margin-bottom: 10px;">Selected Files:</h3>';
            selectedFiles.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <span>📄 ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)</span>
                    <button onclick="removeFile(${index})">Remove</button>
                `;
                fileList.appendChild(fileItem);
            });
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
            analyzeButton.disabled = selectedFiles.length === 0;
        }

        analyzeButton.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;

            loading.style.display = 'block';
            results.style.display = 'none';
            analyzeButton.disabled = true;

            const formData = new FormData();
            selectedFiles.forEach(file => {
                formData.append('files', file);
            });

            try {
                const response = await fetch('/analyze-pdf-batch', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                analysisResults = await response.json();
                displayResults(analysisResults);
            } catch (error) {
                alert(`Error analyzing PDFs: ${error.message}`);
                console.error('Error:', error);
            } finally {
                loading.style.display = 'none';
                analyzeButton.disabled = false;
            }
        });

        function displayResults(data) {
            // Display summary cards
            const summaryCards = document.getElementById('summaryCards');
            const summary = data.analysis.fraud_summary;
            
            summaryCards.innerHTML = `
                <div class="summary-card">
                    <h3>${summary.total_voters}</h3>
                    <p>Total Voters</p>
                </div>
                <div class="summary-card danger">
                    <h3>${summary.flagged_voters}</h3>
                    <p>Flagged Voters</p>
                </div>
                <div class="summary-card danger">
                    <h3>${summary.high_risk}</h3>
                    <p>High Risk</p>
                </div>
                <div class="summary-card warning">
                    <h3>${summary.medium_risk}</h3>
                    <p>Medium Risk</p>
                </div>
                <div class="summary-card success">
                    <h3>${summary.low_risk}</h3>
                    <p>Low Risk</p>
                </div>
                <div class="summary-card warning">
                    <h3>${summary.duplicate_count}</h3>
                    <p>Duplicates Found</p>
                </div>
                <div class="summary-card">
                    <h3>${data.extraction.total_pdfs}</h3>
                    <p>PDFs Processed</p>
                </div>
                <div class="summary-card">
                    <h3>${data.extraction.languages_detected.join(', ') || 'N/A'}</h3>
                    <p>Languages</p>
                </div>
            `;

            // Display voters
            displayVoters(data.analysis.analyzed_voters);

            results.style.display = 'block';

            // Setup filters
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    displayVoters(data.analysis.analyzed_voters);
                });
            });
        }

        function displayVoters(voters) {
            const votersList = document.getElementById('votersList');
            
            // Filter voters
            let filteredVoters = voters;
            if (currentFilter !== 'all') {
                if (currentFilter === 'flagged') {
                    filteredVoters = voters.filter(v => v.flagged);
                } else if (currentFilter === 'duplicates') {
                    filteredVoters = voters.filter(v => v.duplicate_info.has_duplicates);
                } else {
                    filteredVoters = voters.filter(v => v.risk_level === currentFilter);
                }
            }

            votersList.innerHTML = '';
            
            filteredVoters.forEach(voter => {
                const voterRow = document.createElement('div');
                voterRow.className = 'voter-row';
                voterRow.innerHTML = `
                    <div class="voter-header" onclick="toggleDetails(${voter.voter_id})">
                        <div><strong>Voter #${voter.voter_id}</strong><br>PDF ${voter.source_pdf}</div>
                        <div><strong>${voter.data.name || 'N/A'}</strong><br>${voter.data.id_number || 'No ID'}</div>
                        <div><span class="risk-badge risk-${voter.risk_level}">${voter.risk_level}</span></div>
                        <div><strong>Risk: ${voter.risk_score}%</strong></div>
                    </div>
                    <div class="voter-details" id="details-${voter.voter_id}">
                        ${getVoterDetails(voter)}
                    </div>
                `;
                votersList.appendChild(voterRow);
            });

            if (filteredVoters.length === 0) {
                votersList.innerHTML = '<div style="padding: 40px; text-align: center; color: #666;">No voters match the selected filter</div>';
            }
        }

        function toggleDetails(voterId) {
            const details = document.getElementById(`details-${voterId}`);
            details.classList.toggle('expanded');
        }

        function getVoterDetails(voter) {
            const flags = Object.entries(voter.flags).map(([key, value]) => {
                const label = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                return `<span class="flag-badge ${value ? 'flag-active' : 'flag-inactive'}">${label}</span>`;
            }).join('');

            let duplicateHtml = '';
            if (voter.duplicate_info.has_duplicates) {
                const dupInfo = voter.duplicate_info;
                duplicateHtml = `
                    <div class="duplicate-info">
                        <strong>⚠️ Duplicate Matches Found:</strong><br>
                        ${dupInfo.exact_matches > 0 ? `<div style="margin-top: 10px; color: #dc3545;">Exact matches: ${dupInfo.exact_matches}</div>` : ''}
                        ${dupInfo.similar_entries > 0 ? `<div>Similar entries: ${dupInfo.similar_entries}</div>` : ''}
                        ${Object.entries(dupInfo.field_duplicates || {}).map(([field, matches]) => 
                            `<div style="margin-top: 5px;"><strong>${field}:</strong> ${matches.length} match(es)</div>`
                        ).join('')}
                    </div>
                `;
            }

            return `
                <div class="detail-grid">
                    <div class="detail-item">
                        <div class="detail-label">Name</div>
                        <div>${voter.data.name || 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Date of Birth</div>
                        <div>${voter.data.date_of_birth || 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">ID Number</div>
                        <div>${voter.data.id_number || 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Address</div>
                        <div>${voter.data.address || 'N/A'}</div>
                    </div>
                </div>
                <div class="flags-list">
                    ${flags}
                </div>
                ${duplicateHtml}
            `;
        }

        document.getElementById('exportButton').addEventListener('click', () => {
            if (!analysisResults) return;
            
            const dataStr = JSON.stringify(analysisResults, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `voter-analysis-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
